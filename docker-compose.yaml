# NOTE::
# The services, settings and environment setup in this compose file is for DEVELOPMENT ONLY!
#
# It is intended to run the Apollo server in an "offline" mode. All data will be mocked.
#
networks:
  dmptool-network:
    driver: bridge

services:
  # The database used by the Apollo server
  mysql:
    image: mysql:latest
    container_name: apollo-mysql
    ports:
      - "3307:3306"
      # - "3306:3306"
    expose:
      - 3307
    environment:
      - MYSQL_ROOT_PASSWORD=d0ckerSecr3t
      - MYSQL_DATABASE=dmptool
    networks:
      - dmptool-network
    volumes:
      - ./docker/mysql:/var/lib/mysql

  # The cache used by the Apollo server to store tokens
  redis:
    image: "public.ecr.aws/docker/library/redis:alpine"
    container_name: apollo-redis
    command: redis-server
    networks:
      - dmptool-network
    ports:
      - "6379:6379"
    volumes:
      - "./docker/redis:/var/lib/redis"

  # OpenSearch stand-alone Domain used for related works matching
  opensearch:
    image: "opensearchproject/opensearch:1.3.20"
    container_name: opensearch
    environment:
      - cluster.name=opensearch-cluster # Name the cluster
      - cluster.routing.allocation.disk.threshold_enabled=false # Disable disk allocation threshold checks
      - node.name=opensearch-node1 # Name the node that will run in this container
      - discovery.type=single-node # 👈 Enables single-node mode
      - bootstrap.memory_lock=true # Disable JVM heap memory swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # Set min and max JVM heap sizes
      - "DISABLE_INSTALL_DEMO_CONFIG=true" # Prevents execution of bundled demo script which installs demo certificates and security configurations to OpenSearch
      - "DISABLE_SECURITY_PLUGIN=true"
    command: ["opensearch", "-Elogger.level=WARN"]
    volumes:
      - "./docker/opensearch:/usr/share/opensearch/data"
    ports:
      - 9200:9200 # REST API
      - 9600:9600 # Performance Analyzer
    networks:
      - dmptool-network

  # We use LocalStack to mock AWS services. We are using it to mock the DynamoDB
  # table used to store the maDMP versions of Plans. Interactions between the
  # Apollo server and DynamoDB are made via SQS messages that trigger Lambda
  # functions.
  #
  # See the ./localstack-setup/init-aws.sh script for more details.
  #
  # Note: that because we are using the free version of LocalStack, the DynamoDB
  #       table, Lambda Function and SQS Queues do not persist between restarts.
  localstack:
    image: "localstack/localstack"
    container_name: localstack
    networks:
      - dmptool-network
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN- }
      - DEBUG=${DEBUG:-0}
      - SERVICES=ses,sqs,lambda,ssm,logs,events,dynamodb,opensearch
      - "OPENSEARCH_PERFORMANCE_ANALYZER_ENABLED=false"
      - LS_LOG=WARN
      - DISABLE_LOCALSTACK=0
    volumes:
      - "./docker/localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Load local Lambda code and init-aws.sh startup scripts
      - "./localstack-setup:/etc/localstack/init/ready.d"
      - "./lambdas:/etc/lambda-code"
    healthcheck:
      # Check both gateway readiness AND ready.d script completion
      test: [ "CMD", "bash", "-c", "[ \"$${DISABLE_LOCALSTACK:-0}\" = \"1\" ] || curl -f http://localhost:4566/_localstack/health | grep -q '\"s3\": \"running\"'" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # The Apollo server (GraphQL)
  apollo:
    container_name: apollo-server
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      opensearch:
        condition: service_started
      localstack:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    networks:
      - dmptool-network
    expose:
      - 4000
    env_file:
      - .env
    environment:
      - "AWS_ACCESS_KEY_ID=DUMMYIDEXAMPLE"
      - "AWS_SECRET_ACCESS_KEY=DUMMYEXAMPLEKEY"
      - "REGION=us-west-2"
      - "NODE_ENV=development"

      # Local MySQL database
      - "MYSQL_CONNECTION_LIMIT=5"
      - "MYSQL_HOST=apollo-mysql"
      - "MYSQL_PORT=3306"
      - "MYSQL_DATABASE=dmptool"
      - "MYSQL_USER=root"
      - "MYSQL_PASSWORD=d0ckerSecr3t"

      # Local Redis cache
      - "CACHE_HOST=apollo-redis"
      - "CACHE_PORT=6379"
      - "CACHE_CONNECT_TIMEOUT=10000"

      # OpenSearch used for works matching functionality
      - "OPENSEARCH_HOST=opensearch"
      - "OPENSEARCH_PORT=9200"
      - "OPENSEARCH_USE_SSL=false"
      - "OPENSEARCH_VERIFY_CERTS=false"
      - "OPENSEARCH_AUTH_TYPE="

      # OpenSearch Serverless used for all other search functionality
      # (we use the same OpenSearch instance in this local environment)
      - "OPENSEARCH_SERVERLESS_NODE=http://opensearch:9200"

      # LocalStack Port
      - "LOCALSTACK_PORT=4566"

      # DynamoDB table used to store maDMP versions
      - "DYNAMO_ENDPOINT=http://localstack:4566"
      - "DYNAMODB_TABLE_NAME=localDMPTable"
      - "MAX_ATTEMPTS=3"

      # LocalStack managed S3 bucket
      - "S3_BUCKET=local-s3-bucket"
    volumes:
      - ".:/app"
      - /app/node_modules          # Tells Docker NOT to overwrite node_modules. It just worked with ts-node-dev because that is written in 100% javascript. When our Mac's node_modules folder overwrote our Docker container's folder in the past,
      # the Linux container didn't care. It could read and execute the pure JavaScript files from your Mac fine because Node.js translates JavaScript the same way on any operating system. tsx is built
      # on top of a tool called esbuild, which is written in Go and compiled into raw, native machine code to make it ultra fast. A binary compiled
      # for macOS (Darwin ARM64) is built out of specific instructions meant exclusively for Apple Silicon chips and Apple's kernel. A binary compiled for
      # Linux (Linux ARM64) uses completyely different machine instructions mean for a Linux kernel.
      # Mount the mysql certs directory so Apollo can see them
      - "./docker/mysql/server-cert.pem:/etc/mysql-cert.pem:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
